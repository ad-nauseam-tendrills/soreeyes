# /etc/nginx/sites-available/soreeyes  (then: ln -s ../sites-available/soreeyes /etc/nginx/sites-enabled/)
# A new, separate server block — the existing edgarbustos.art / benchy configs are untouched.
# After it works over HTTP, run: sudo certbot --nginx -d soreeyes.edgarbustos.art
server {
    listen 80;
    listen [::]:80;
    server_name soreeyes.edgarbustos.art;

    # Optional attempt photos are downscaled client-side; 10 MB is plenty.
    client_max_body_size 10m;

    # Everything goes to the app, which requires the owner login for every page,
    # exercise sheet, print job, photo and export. Do NOT add a `root` or any
    # static `location` here — no files should be served directly by nginx.
    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite (not append) so the login throttle can't be bypassed by a spoofed header.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
